plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = '1.0.0'
group = 'com.hoyi.recordport'
base {
    archivesName = 'Vanilla_Music_Disc_Port-forge1.20.1'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                record_port {
                    source sourceSets.main
                }
            }
        }
        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                record_port {
                    source sourceSets.main
                }
            }
        }
    }
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.3.22'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.debug = false
    options.debugOptions.debugLevel = ''
}

tasks.withType(Jar).configureEach {
    archiveBaseName = 'Vanilla_Music_Disc_Port-forge1.20.1'
    archiveVersion = '1.0.0'
    exclude '**/*.java'
}

jar {
    manifest {
        attributes([
                'Specification-Title'   : 'record_port',
                'Specification-Vendor'  : 'Hoyi',
                'Specification-Version' : '1',
                'Implementation-Title'  : 'Record Port',
                'Implementation-Version': '1.0.0',
                'Implementation-Vendor' : 'Hoyi'
        ])
    }
}

jar.finalizedBy('reobfJar')
