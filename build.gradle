plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = '1.0.0'
group = 'com.hoyi.recordport'
base {
    archivesName = 'Vanilla_Music_Disc_Port-neoforge1.21.1'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = '21.1.255'

    runs {
        client {
            client()
        }
        server {
            server()
            programArguments.addAll('--nogui')
        }
    }
    mods {
        record_port {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    mavenCentral()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(Jar).configureEach {
    archiveBaseName = 'Vanilla_Music_Disc_Port-neoforge1.21.1'
    archiveVersion = '1.0.0'
    exclude '**/*.java'
}

jar {
    manifest {
        attributes([
                'Specification-Title'   : 'record_port',
                'Specification-Vendor'  : 'Hoyi',
                'Specification-Version' : '1',
                'Implementation-Title'  : 'Record Port',
                'Implementation-Version': '1.0.0',
                'Implementation-Vendor' : 'Hoyi'
        ])
    }
}
